name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Шаг 1: Если проект залит в архиве, распаковываем его
    - name: Unzip project if needed
      run: |
        find . -name "*.zip" -exec unzip -o {} \; || true

    # Шаг 2: Автоматически находим папку, где лежит проект
    - name: Find Project Root Directory
      id: find-dir
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \+ | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \+ | head -n 1)
        fi
        if [ -z "$PROJECT_DIR" ]; then
          PROJECT_DIR="."
        fi
        echo "Found project directory at: $PROJECT_DIR"
        echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

    # Шаг 3: Настраиваем Gradle версии 8.7
    - name: Validate and Setup Gradle
      run: |
        cd ${{ steps.find-dir.outputs.dir }}
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    # Шаг 4: Компилируем приложение и ПРИНУДИТЕЛЬНО ИГНОРИРУЕМ ошибку JVM-target
    # Флаг -Pkotlin.jvm.target.validation.mode=ignore заставит Kotlin закрыть глаза на разницу версий
    - name: Build Debug APK
      run: |
        cd ${{ steps.find-dir.outputs.dir }}
        ./gradlew assembleDebug -Pkotlin.jvm.target.validation.mode=ignore --no-daemon

    # Шаг 5: Сохраняем готовый файл
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-apk
        path: |
          **/build/outputs/apk/debug/*-debug.apk
