name: Build APK from Web Files

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create my-app com.horror.voice MyHorrorApp
        cd my-app
        cordova platform add android
        
    - name: Copy Web Files to App
      run: |
        # Копируем ваши файлы (index.html и др.) в папку сборки приложения
        rm -rf my-app/www/*
        cp -r . my-app/www/ || true
        # Удаляем из папки сборки сам проект Cordova, чтобы не зациклился
        rm -rf my-app/www/my-app

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build APK via Cordova
      run: |
        cd my-app
        cordova build android --debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-app-apk
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
