name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Пробуем использовать современную Java 21 (часто нужна для build.gradle.kts)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    # На всякий случай генерируем чистый gradlew wrapper, если его не было в репозитории
    - name: Validate and Setup Gradle
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-apk
        path: app/build/outputs/apk/debug/app-debug.apk
