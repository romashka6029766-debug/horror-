name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    # Указываем серверу зайти в папку с проектом и создать там настройки Gradle
    - name: Validate and Setup Gradle
      working-directory: ./HorrorVoice_2.0_Android_Project
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    # Собираем приложение прямо внутри папки проекта
    - name: Build Debug APK
      working-directory: ./HorrorVoice_2.0_Android_Project
      run: ./gradlew assembleDebug --no-daemon

    # Забираем готовый APK из подпапки
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: horror-voice-apk
        path: HorrorVoice_2.0_Android_Project/app/build/outputs/apk/debug/app-debug.apk
